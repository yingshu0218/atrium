# 部署模板(Atrium §21 / PRD §22):Docker Compose + Caddy + Litestream。
# 复制为生产配置后按需修改;域名、密钥等通过 .env / 环境变量注入。
services:
  server:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "apps/server/dist/index.js"]
    env_file: ../.env
    volumes:
      - ./../:/app:ro
      - data:/app/data
      - mirror:/app/.data-mirror
    restart: unless-stopped
    expose:
      - "3000"

  # Litestream 备份边车:把 SQLite 持续复制到对象存储/远程(见 litestream.yml)。
  litestream:
    image: litestream/litestream:0.3
    command: ["replicate"]
    env_file: ../.env
    volumes:
      - data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    restart: unless-stopped
    depends_on:
      - server

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - server

volumes:
  data:
  mirror:
  caddy_data:
  caddy_config:
